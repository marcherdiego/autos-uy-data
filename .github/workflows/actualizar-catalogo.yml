name: Actualizar catálogo

# Autoblog publica los precios cuando los importadores se los pasan, sin horario
# fijo: una corrida por día alcanza. La corrida manual queda para cuando se sabe
# que hubo un cambio y no se quiere esperar.
on:
  schedule:
    - cron: "0 11 * * *"   # 08:00 en Uruguay (UTC-3)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4

      - name: Leer la página de precios
        id: scrape
        run: |
          python3 tools/scrape_catalog.py | tee /tmp/resumen.txt

      - name: Publicar el catálogo si cambió
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Sin cambios: no se commitea nada." >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/resumen.txt >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          version=$(python3 -c "import json;print(json.load(open('catalog.json'))['dataVersion'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # changelog.json lo escribe el scraper junto con el catálogo: es lo
          # que lee el panel de monitoreo.
          git add catalog.json changelog.json
          git commit -m "Catálogo $version

          $(cat /tmp/resumen.txt)"
          git push

          {
            echo "### Catálogo actualizado — \`$version\`"
            echo ""
            echo '```'
            cat /tmp/resumen.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
